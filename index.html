<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styel.css" />
    <!--Fuente-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <!--Iconos-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>InstaFront</title>
  </head>
  <body>
    <div class="container-grid-area">
      <header class="area-header">
        <div class="item1"><span>InstaFront</span></div>
        <div class="item2">buscador</div>
        <div class="item3"><img class="img-header" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
      </header>
      <main class="area-main">
        <section class="historias">
          <div class="historia-1"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-2"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-3"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-4"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-5"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-6"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
          <div class="historia-7"><img class="img-historias" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
        </section>
        <section class="post">
          <article>
            <div class="card-encabezado">
              <div><img class="img-header" src="./img/foto-perfil.png" alt="Foto-perfil" /></div>
              <div><h2>Abril Gonzalez</h2></div>
              <div><i class="fa-solid fa-ellipsis"></i></div>
            </div>
            <div class="card-cuerpo">
              <div class="card-img"><img class="card-img-perfil" src="./img/foto-perfil.png" alt="" /></div>
              <div class="card-iconos">
                <i class="fa-regular fa-heart"></i> <i class="fa-regular fa-comment"></i><i class="fa-regular fa-paper-plane"></i
                ><i class="fa-regular fa-face-smile"></i>
              </div>
              <div class="card-textos">
                <p>Les gusta a lilipringles y otras personas</p>
                <span>Ver los 3,672 comentarios</span>
                <p>Gabriela Mancini Hola! que placer verte en fronend!!</p>
                <p>Jonathan Gonzalez Te estabamamos esperando!! Vamoch!</p>
              </div>
            </div>
          </article>
        </section>
      </main>
      <aside class="area-sidebar">SIDEBAR</aside>
      <footer class="area-footer"><p>Todos los derechos reservados a NOMBRE PROGRAMADOR/A</p></footer>
    </div>
  </body>
</html>
